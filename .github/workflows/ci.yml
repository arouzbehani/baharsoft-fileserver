name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-ui/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Verify API
        run: npm run verify:full

      - name: Install admin dependencies
        run: npm --prefix admin-ui ci

      - name: Build admin UI
        run: npm run admin:build

      - name: Validate Compose package
        env:
          FILESERVER_TOKEN_SIGNING_SECRET: ci-signing-secret-12345678901234567890
          FILESERVER_ADMIN_BOOTSTRAP_TOKEN: ci-bootstrap-token-12345678901234567890
        run: docker compose -f deploy/compose.yaml -f deploy/compose.build.yaml config --quiet

  container:
    name: Build container
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=ci
          tags: baharsoft-fileserver:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
